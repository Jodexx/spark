import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'com.gradleup.shadow' version '8.3.8'
    id 'java-library'
    id 'maven-publish'
}

tasks.withType(JavaCompile).configureEach {
    // override, compile targeting J21
    options.release = 25
}

dependencies {
    var minestom = "net.minestom:minestom:2026.10.07-26.2"

    api "me.lucko:spark-common:${project.baseVersion}-SNAPSHOT"

    compileOnly minestom
    implementation "ch.qos.logback:logback-classic:1.5.28"
    implementation "com.google.guava:guava:33.3.1-jre"

    testImplementation minestom
    testImplementation "ch.qos.logback:logback-classic:1.5.28"
}

task processSource(type: Sync) {
    from sourceSets.main.java
    filter(ReplaceTokens, tokens: [VERSION: project.version])
    into project.getLayout().getBuildDirectory().get().dir("src")
}

compileJava {
    source = processSource.outputs
}

shadowJar {
    archiveFileName = "spark-${project.baseVersion}-build${project.extraVersion}-minestom.jar"

    dependencies {
        exclude(dependency('net.kyori:^(?!adventure-text-feature-pagination).+$'))
    }

    relocate 'net.kyori.adventure.text.feature.pagination', 'me.lucko.spark.lib.adventure.pagination'
    relocate 'net.bytebuddy', 'me.lucko.spark.lib.bytebuddy'
    relocate 'com.google.protobuf', 'me.lucko.spark.lib.protobuf'
    relocate 'org.objectweb.asm', 'me.lucko.spark.lib.asm'
    relocate 'one.profiler', 'me.lucko.spark.lib.asyncprofiler'
    relocate 'me.lucko.bytesocks.client', 'me.lucko.spark.lib.bytesocks'
    relocate 'org.java_websocket', 'me.lucko.spark.lib.bytesocks.ws'

    project.applyExcludes(delegate)
}

artifacts {
    archives shadowJar
    shadow shadowJar
}

java {
    withJavadocJar()
    withSourcesJar()
}

publishing {
    repositories {
        maven {
            name = 'hyperaSnapshots'
            url = 'https://repo.hypera.dev/snapshots/'
            credentials(PasswordCredentials)
        }
    }

    publications {
        mavenJava(MavenPublication) {
            artifactId = 'spark-minestom'

            from components.java

            pom {
                name = 'Spark Minestom'
                description = 'A performance profiler for Minestom servers.'
                url = 'https://github.com/LooFifteen/spark'

                licenses {
                    license {
                        name = 'GNU General Public License version 3'
                        url = 'https://opensource.org/license/gpl-3-0'
                    }
                }

                developers {
                    developer {
                        id = 'lucko'
                        name = 'Luck'
                        url = 'https://lucko.me'
                        email = 'git@lucko.me'
                    }
                    developer {
                        id = 'LooFifteen'
                        name = 'LU15'
                        url = 'https://lu15.dev'
                        email = 'luis@lu15.dev'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/LooFifteen/spark.git'
                    developerConnection = 'scm:git:git@github.com:LooFifteen/spark.git'
                    url = 'https://github.com/LooFifteen/spark'
                }

                issueManagement {
                    system = 'GitHub'
                    url = 'https://github.com/LooFifteen/spark/issues'
                }
            }
        }
    }
}